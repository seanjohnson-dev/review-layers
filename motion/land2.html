<!doctype html>
<!-- review-layers, told by the code itself. No narration, no captions: every word on screen is a real
     string (the mod's own source, the demo project's code, the captured runs in capture/). The camera
     travels through a corridor of code; one change passes each layer. window.seek(t) draws any moment. -->
<html lang="en-ZA">
<meta charset="utf-8">
<style>
  html, body { margin:0; height:100%; background:#060709; overflow:hidden; }
  canvas#gl { position:absolute; inset:0; width:100%; height:100%; }
  .vignette { position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(130% 100% at 50% 50%, transparent 50%, rgba(0,0,0,.8) 100%); }
  .bars { position:absolute; left:0; right:0; height:7.4%; background:#000; pointer-events:none; }
  .bars.t { top:0; } .bars.b { bottom:0; }
  .grain { position:absolute; inset:0; pointer-events:none; opacity:.08; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .flash { position:absolute; inset:0; pointer-events:none; background:#ff5d5d; opacity:0; mix-blend-mode:screen; }
</style>
<body>
<canvas id="gl"></canvas>
<div class="vignette"></div>
<div class="flash" id="flash"></div>
<div class="bars t"></div><div class="bars b"></div>
<div class="grain"></div>
<script src="vendor/three.min.js"></script>
<script src="data.js"></script>
<script>
// ---------- time ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const E = { out: x => 1 - Math.pow(1 - x, 4), inOut: x => (x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2), in: x => x ** 3, lin: x => x, smooth: x => x * x * (3 - 2 * x) };
const T = (t, s, d, fn = E.out) => fn(clamp((t - s) / d));
const win = (t, s, e, fi = .6, fo = .6) => T(t, s, fi) * (1 - T(t, e - fo, fo, E.in));
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const D = window.DATA;
D.approve = D.approve.split('\n').filter(l => !l.startsWith('Warning: no stdin')).join('\n');

// ---------- colours ----------
const COL = { bg: '#060709', fg: '#e9e7e0', dim: '#6f7480', kw: '#c792ea', str: '#9dffb0', num: '#ffb454', cmt: '#56606f', fn: '#82b1ff', add: '#9dffb0', del: '#ff5d5d', ok: '#9dffb0', red: '#ff5d5d', amber: '#ffb454', prompt: '#8b8f99', line: '#3a3f4a' };

// ---------- a tiny tokenizer, enough to colour real JS/TS and diffs ----------
const KW = new Set('const let var function return if else for of in new async await export import from default class extends throw try catch finally typeof void null undefined true false this switch case break continue while do yield interface type declare as readonly'.split(' '));
function tokensJs(line) {
  const out = []; let i = 0;
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)(?=\s*\()|([A-Za-z_$][\w$]*)|(\s+)|(.)/g;
  let m;
  while ((m = re.exec(line))) {
    if (m[1]) out.push([m[1], COL.cmt]);
    else if (m[2]) out.push([m[2], COL.str]);
    else if (m[3]) out.push([m[3], COL.num]);
    else if (m[4]) out.push([m[4], KW.has(m[4]) ? COL.kw : COL.fn]);
    else if (m[5]) out.push([m[5], KW.has(m[5]) ? COL.kw : COL.fg]);
    else out.push([m[6] ?? m[7], COL.fg]);
  }
  return out;
}
function tokensDiff(line) {
  if (line.startsWith('+++') || line.startsWith('---')) return [[line, COL.dim]];
  if (line.startsWith('@@')) return [[line, COL.fn]];
  if (line.startsWith('diff ') || line.startsWith('index ')) return [[line, COL.dim]];
  if (line.startsWith('+')) return [['+', COL.add], ...tokensJs(line.slice(1)).map(([s, c]) => [s, c === COL.fg ? COL.add : c])];
  if (line.startsWith('-')) return [['-', COL.del], ...tokensJs(line.slice(1)).map(([s, c]) => [s, c === COL.fg ? COL.del : c])];
  return tokensJs(line).map(([s, c]) => [s, c === COL.fg ? '#a9ada0' : c]);
}
function tokensTerm(line) {
  if (/^\$ /.test(line)) return [['$ ', COL.prompt], [line.slice(2), COL.fg]];
  if (/^\s*✓/.test(line)) return [[line, COL.ok]];
  if (/^\s*✗/.test(line)) return [[line, COL.red]];
  if (/^\s*▸/.test(line)) return [[line, COL.amber]];
  if (/^\s*–/.test(line)) return [[line, COL.dim]];
  if (/^review-layers · GREEN/.test(line)) return [['review-layers · ', COL.dim], ['GREEN', COL.ok], [line.slice(22), COL.fg]];
  if (/^review-layers · RED/.test(line)) return [['review-layers · ', COL.dim], ['RED', COL.red], [line.slice(20), COL.fg]];
  if (/^review-layers: a push/.test(line)) return [[line, COL.red]];
  if (/^Approved/.test(line)) return [[line, COL.ok]];
  if (/^\d+\. \[IMPORTANT/.test(line)) { const k = line.indexOf(']') + 1; return [[line.slice(0, k), COL.red], [line.slice(k), COL.fg]]; }
  if (/^\d+\. \[nit/.test(line)) { const k = line.indexOf(']') + 1; return [[line.slice(0, k), COL.amber], [line.slice(k), COL.fg]]; }
  if (/^\s+(class|why|fix|also):/.test(line)) { const k = line.indexOf(':') + 1; return [[line.slice(0, k), COL.dim], [line.slice(k), '#b9bcc4']]; }
  if (/^\s+ℹ /.test(line)) return [[line, COL.dim]];
  if (/^\s+> /.test(line)) return [[line, COL.dim]];
  if (/^ \* \[new branch\]/.test(line)) return [[' * ', COL.dim], ['[new branch]', COL.ok], [line.slice(14), COL.fg]];
  return [[line, COL.fg]];
}

// ---------- panels: real text drawn to a canvas, shown on a plane, with a blurred twin for depth of field ----------
const FONT = 'Menlo, "SF Mono", monospace';
function drawText(ctx, lines, kind, opt) {
  const { px, lh, pad, gutter, width, height, revealChars = Infinity, cursor = false, revealLines = Infinity } = opt;
  ctx.fillStyle = opt.bg ?? 'rgba(10,11,15,.94)';
  ctx.fillRect(0, 0, width, height);
  if (opt.title) {
    ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(0, 0, width, lh + pad * .6);
    ctx.font = `${px * .82}px ${FONT}`; ctx.fillStyle = COL.dim; ctx.textBaseline = 'top';
    ctx.fillText(opt.title, pad, pad * .45);
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(width - pad - i * px * 1.1, pad * .45 + px * .45, px * .3, 0, 7); ctx.fillStyle = '#2d313a'; ctx.fill(); }
  }
  ctx.font = `${px}px ${FONT}`; ctx.textBaseline = 'top';
  const tok = kind === 'diff' ? tokensDiff : kind === 'term' ? tokensTerm : kind === 'plain' ? (l) => [[l, COL.fg]] : tokensJs;
  let budget = revealChars;
  const top = pad + (opt.title ? lh + pad * .6 : 0);
  for (let i = 0; i < lines.length && i < revealLines; i++) {
    const y = top + i * lh;
    if (y > height) break;
    const line = lines[i];
    if (kind === 'diff' && (line.startsWith('+') && !line.startsWith('+++'))) { ctx.fillStyle = 'rgba(157,255,176,.07)'; ctx.fillRect(0, y - lh * .12, width, lh); }
    if (kind === 'diff' && (line.startsWith('-') && !line.startsWith('---'))) { ctx.fillStyle = 'rgba(255,93,93,.08)'; ctx.fillRect(0, y - lh * .12, width, lh); }
    let x = pad;
    if (gutter) { ctx.fillStyle = COL.line; ctx.fillText(String(opt.firstLine + i).padStart(3, ' '), x, y); x += px * 2.6; }
    for (const [s, c] of tok(line)) {
      if (budget <= 0) break;
      const piece = s.length > budget ? s.slice(0, budget) : s;
      budget -= piece.length;
      ctx.fillStyle = c; ctx.fillText(piece, x, y); x += ctx.measureText(piece).width;
    }
    if (budget <= 0) { if (cursor) { ctx.fillStyle = COL.fg; ctx.fillRect(x + px * .1, y, px * .55, lh * .85); } break; }
    budget -= 1; // the newline
  }
}

class Panel {
  constructor({ text, kind = 'code', width = 6, cols = 92, title, gutter = false, firstLine = 1, maxLines = 40, px = 30, blur = 10, bg }) {
    this.lines = String(text).replace(/\t/g, '  ').split('\n').slice(0, maxLines);
    this.kind = kind; this.title = title; this.gutter = gutter; this.firstLine = firstLine; this.bg = bg;
    this.px = px; this.lh = Math.round(px * 1.42); this.pad = Math.round(px * 1.1);
    this.W = Math.round(cols * px * .6 + this.pad * 2 + (gutter ? px * 2.6 : 0));
    this.H = Math.round(this.lines.length * this.lh + this.pad * 2 + (title ? this.lh + this.pad * .6 : 0));
    this.width = width; this.height = width * this.H / this.W;
    this.c = document.createElement('canvas'); this.c.width = this.W; this.c.height = this.H;
    this.cb = document.createElement('canvas'); this.cb.width = this.W >> 1; this.cb.height = this.H >> 1;
    this.blur = blur;
    this.tex = new THREE.CanvasTexture(this.c); this.tex.anisotropy = 8; this.tex.minFilter = THREE.LinearMipmapLinearFilter;
    this.texB = new THREE.CanvasTexture(this.cb);
    this.g = new THREE.Group();
    const geo = new THREE.PlaneGeometry(this.width, this.height);
    this.sharp = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: this.tex, transparent: true, opacity: 1, depthWrite: false }));
    this.soft = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: this.texB, transparent: true, opacity: 0, depthWrite: false }));
    this.soft.position.z = -.002;
    this.edge = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .08 }));
    this.g.add(this.soft, this.sharp, this.edge);
    this.alpha = 1; this.lastKey = null;
    this.draw();
    scene.add(this.g);
  }
  draw(revealChars = Infinity, cursor = false) {
    const key = revealChars + (cursor ? 'c' : '');
    if (key === this.lastKey) return;
    this.lastKey = key;
    const opt = { px: this.px, lh: this.lh, pad: this.pad, gutter: this.gutter, width: this.W, height: this.H, title: this.title, firstLine: this.firstLine, revealChars, cursor, bg: this.bg };
    drawText(this.c.getContext('2d'), this.lines, this.kind, opt);
    const b = this.cb.getContext('2d');
    b.save(); b.filter = `blur(${this.blur}px)`; b.scale(.5, .5); b.drawImage(this.c, 0, 0); b.restore();
    this.tex.needsUpdate = true; this.texB.needsUpdate = true;
  }
  // line i's centre, in the panel's local space
  lineY(i) { const top = this.pad + (this.title ? this.lh + this.pad * .6 : 0); return this.height / 2 - (top + i * this.lh + this.lh * .4) * (this.height / this.H); }
  set(pos, rot = [0, 0, 0]) { this.g.position.set(...pos); this.g.rotation.set(...rot); return this; }
  // depth of field: how far this panel sits from the focus distance decides sharp against soft
  focus(camera, focusDist, range) {
    const d = camera.position.distanceTo(this.g.position);
    const f = Math.exp(-Math.pow(Math.abs(d - focusDist) / range, 2));
    this.sharp.material.opacity = this.alpha * f;
    this.soft.material.opacity = this.alpha * (1 - f) * .92;
    this.edge.material.opacity = .08 * this.alpha * f;
    this.g.visible = this.alpha > .003;
  }
}

// ---------- the scene ----------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setClearColor(0x060709, 1);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x060709, .028);
const camera = new THREE.PerspectiveCamera(38, 16 / 9, .1, 120);

// the corridor: walls of the mod's own source and the demo's files, receding into the dark
const rnd = mulberry(11);
const regLines = D.register.split('\n');
const corridor = [];
function chunk(src, at, n) { return src.split('\n').slice(at, at + n).join('\n'); }
for (let i = 0; i < 44; i++) {
  const side = i % 2 ? 1 : -1;
  const z = -4 - i * 1.45 - rnd() * .8;
  const hero = z > -16.5 || (z < -21 && z > -36);
  const x = side * ((hero ? 9.2 : 6.2) + rnd() * 3.0);
  const y = (rnd() - .5) * 5.2;
  const at = Math.floor(rnd() * (regLines.length - 36));
  const src = i % 7 === 3 ? D.cart : i % 7 === 5 ? D.checkout : i % 9 === 8 ? D.cartTest : chunk(D.register, at, 34);
  const title = i % 7 === 3 ? 'src/cart.js' : i % 7 === 5 ? 'src/checkout.js' : i % 9 === 8 ? 'test/cart.test.js' : `hooks/register.tsx · ${at + 1}`;
  const p = new Panel({ text: src, kind: 'code', width: 4.6 + rnd() * 1.6, cols: 84, px: 26, title, gutter: true, firstLine: i % 7 === 3 || i % 7 === 5 || i % 9 === 8 ? 1 : at + 1, maxLines: 34, blur: 8, bg: 'rgba(8,9,12,.9)' });
  p.set([x, y, z], [(rnd() - .5) * .25, side * (-.55 - rnd() * .35), (rnd() - .5) * .08]);
  p.base = .55 + rnd() * .35;
  corridor.push(p);
}
// a floor and ceiling of faint lines, for the sense of a corridor
const grid = new THREE.GridHelper(140, 70, 0x161920, 0x10131a); grid.position.y = -3.6; grid.position.z = -40; scene.add(grid);
const grid2 = new THREE.GridHelper(140, 70, 0x161920, 0x10131a); grid2.position.y = 3.6; grid2.position.z = -40; scene.add(grid2);

// the subjects
const gitLog = new Panel({ text: D.gitLog, kind: 'plain', width: 4.8, cols: 86, px: 28, title: '$ git log --oneline --decorate -3', blur: 8 }).set([-3.0, 1.9, -10.2], [0, .28, 0]);
const diffP = new Panel({ text: D.featureDiff, kind: 'diff', width: 6.4, cols: 90, px: 27, title: 'git diff main...feature/bulk-discount', maxLines: 44, blur: 9 }).set([0, .1, -14], [0, 0, 0]);
const fixP = new Panel({ text: D.fixDiff, kind: 'diff', width: 6.4, cols: 90, px: 27, title: 'git diff · keep the bulk discount in cents, clamp the total, round the average line', maxLines: 44, blur: 9 }).set([0, .1, -13.9], [0, 0, 0]);
const term = new Panel({ text: D.red, kind: 'term', width: 7.2, cols: 104, px: 26, title: 'claude · ~/mods/land-demo · feature/bulk-discount', maxLines: 20, blur: 9 }).set([-5.4, -.55, -11.6], [0, .62, 0]);
const term2Text = `$ /land\n${D.green}`;
const term2 = new Panel({ text: term2Text, kind: 'term', width: 7.2, cols: 104, px: 26, title: 'claude · ~/mods/land-demo · feature/bulk-discount', maxLines: 22, blur: 9 }).set([-5.4, -.55, -11.6], [0, .62, 0]);
const term3Text = `${D.pushDenied}\n$ /land approve read the evidence: discount checked in cents by hand, tests cover the empty cart and the clamp\n${D.approve}\n$ git push -u origin feature/bulk-discount\n${D.push}`;
const term3 = new Panel({ text: term3Text, kind: 'term', width: 7.4, cols: 108, px: 26, title: 'claude · ~/mods/land-demo · feature/bulk-discount', maxLines: 14, blur: 9 }).set([-4.4, -.35, -32.6], [0, .55, 0]);
const testsP = new Panel({ text: `$ npm test\n${D.tests}`, kind: 'term', width: 3.6, cols: 40, px: 28, blur: 8 }).set([4.9, -1.9, -12.6], [0, -.5, 0]);

// the findings, pinned to the lines of the diff they name
const redLines = D.red.split('\n');
function findingBlock(n) {
  const i = redLines.findIndex(l => l.startsWith(`${n}. [`));
  if (i < 0) return '';
  const out = [redLines[i]];
  for (let j = i + 1; j < redLines.length && /^\s{3}\S/.test(redLines[j]); j++) out.push(redLines[j]);
  const wrap = (l, w) => { const ind = /^\s*/.exec(l)[0].length ? '        ' : ''; const words = l.trim().split(' '); const rows = []; let cur = ''; for (const wd of words) { if ((cur + ' ' + wd).trim().length > w && cur) { rows.push(cur); cur = ind + wd; } else cur = (cur ? cur + ' ' : (ind && !rows.length ? '   ' : '')) + wd; } if (cur) rows.push(cur); return rows; };
  return out.flatMap(l => wrap(l, 62)).slice(0, 11).join('\n');
}
const diffLines = D.featureDiff.split('\n');
const lineOf = (needle) => diffLines.findIndex(l => l.includes(needle));
const findings = [
  { n: 1, at: lineOf('const perUnit = 5'), pos: [4.95, 1.95, -13.5] },
  { n: 2, at: lineOf('return cartTotal(cart) / cart.lines.length'), pos: [5.05, -.05, -13.3] },
  { n: 3, at: lineOf('const base = cartTotal(cart) - bulkDiscount(cart)'), pos: [4.95, -2.05, -13.5] },
].map(f => ({ ...f, panel: new Panel({ text: findingBlock(f.n), kind: 'term', width: 3.9, cols: 64, px: 26, blur: 8, bg: 'rgba(14,10,10,.95)' }).set(f.pos, [0, -.22, 0]) }));
// connectors: a line from each finding to its line of code
const connGeo = new THREE.BufferGeometry();
connGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(findings.length * 2 * 3), 3));
const conn = new THREE.LineSegments(connGeo, new THREE.LineBasicMaterial({ color: 0xff5d5d, transparent: true, opacity: 0 }));
scene.add(conn);
const dots = findings.map(() => { const m = new THREE.Mesh(new THREE.SphereGeometry(.05, 12, 12), new THREE.MeshBasicMaterial({ color: 0xff5d5d, transparent: true, opacity: 0 })); scene.add(m); return m; });

// the seven layers: glass planes down the corridor, each labelled with its real report row
const greenRows = D.green.split('\n').filter(l => /^\s+[✓✗▸–]/.test(l));
const redRows = D.red.split('\n').filter(l => /^\s+[✓✗▸–]/.test(l));
const LZ = [-17, -19.6, -22.2, -24.8, -27.4, -30, -32.6];
const layers = LZ.map((z, k) => {
  const g = new THREE.Group();
  const fill = new THREE.Mesh(new THREE.PlaneGeometry(9.6, 5.2), new THREE.MeshBasicMaterial({ color: 0x9dffb0, transparent: true, opacity: .04, side: THREE.DoubleSide, depthWrite: false }));
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(9.6, 5.2)), new THREE.LineBasicMaterial({ color: 0x9dffb0, transparent: true, opacity: .5 }));
  g.add(fill, edge); g.position.set(k * .25, 0, z); scene.add(g);
  const label = new Panel({ text: redRows[k] ?? '', kind: 'term', width: 3.4, cols: 44, px: 26, blur: 6, bg: 'rgba(7,8,11,.9)' }).set([k * .25 - 3.1, 2.95, z + .02]);
  const label2 = new Panel({ text: greenRows[k] ?? '', kind: 'term', width: 3.4, cols: 44, px: 26, blur: 6, bg: 'rgba(7,8,11,.9)' }).set([k * .25 - 3.1, 2.95, z + .02]);
  return { g, fill, edge, label, label2, z };
});
// the gate, at the end of the corridor
const gateRed = new Panel({ text: redRows[6], kind: 'term', width: 6, cols: 44, px: 40, blur: 10, bg: 'rgba(20,8,8,.96)' }).set([0, 1.0, -36]);
const gateAmber = new Panel({ text: greenRows[6], kind: 'term', width: 6, cols: 52, px: 36, blur: 10, bg: 'rgba(20,14,6,.96)' }).set([0, 1.0, -36]);
const gateOk = new Panel({ text: '  ✓ gate       cleared to push', kind: 'term', width: 6, cols: 44, px: 40, blur: 10, bg: 'rgba(6,20,10,.96)' }).set([0, 1.0, -36]);
// the end: the plugin's own manifest
const endP = new Panel({ text: D.pluginJson.split('\n').slice(0, 9).join('\n').replace(/"description": ".*"/, '"description": "layers, not one gate"'), kind: 'code', width: 6.2, cols: 90, px: 28, title: '.claude-plugin/plugin.json', blur: 10 }).set([0, .45, -52]);
const blogP = new Panel({ text: 'after "How the Claude Code team does code review"\nclaude.dev/blog/solving-code-review-at-anthropic', kind: 'plain', width: 5.2, cols: 70, px: 26, blur: 8, bg: 'rgba(6,7,9,.0)' }).set([0, -1.75, -51.6]);

// the change itself: a small bright card that travels the corridor and passes each layer
const change = new THREE.Mesh(new THREE.BoxGeometry(.6, .36, .03), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 }));
scene.add(change);
const changeGlow = new THREE.Mesh(new THREE.PlaneGeometry(1.3, .85), new THREE.MeshBasicMaterial({ color: 0x9dffb0, transparent: true, opacity: 0, depthWrite: false }));
scene.add(changeGlow);

// ---------- the camera path ----------
const KEYS = [
  { t: 0,    pos: [0.3, 0.5, 4.0],     look: [0, 0.2, -20],      f: 10, r: 8 },
  { t: 7,    pos: [-0.4, 0.7, -3.6],   look: [-0.6, 0.6, -12],   f: 7,  r: 4 },
  { t: 10.5, pos: [0.1, 0.4, -6.6],    look: [0, 0.1, -14],      f: 7.4, r: 3 },
  { t: 14.5, pos: [0.1, 0.3, -6.7],    look: [0, 0.1, -14],      f: 7.4, r: 3 },
  { t: 17,   pos: [-0.1, 0.2, -5.7],   look: [-4.9, -0.5, -11.6], f: 7.4, r: 3.2 },
  { t: 23,   pos: [-0.3, 0.1, -5.6],   look: [-5.0, -0.5, -11.6], f: 7.4, r: 3.2 },
  { t: 26.5, pos: [1.5, 0.3, -4.3],    look: [1.85, 0.1, -13.5], f: 9.3, r: 3.6 },
  { t: 34,   pos: [1.6, 0.2, -4.5],    look: [1.9, 0.0, -13.5],  f: 9.1, r: 3.6 },
  { t: 37.5, pos: [0.3, 0.2, -6.8],    look: [0, 0.1, -14],      f: 7.2, r: 3 },
  { t: 43,   pos: [0.5, 0.0, -7.0],    look: [0.2, 0.0, -14],    f: 7.0, r: 3 },
  { t: 45,   pos: [-0.2, 0.1, -5.7],   look: [-4.9, -0.5, -11.6], f: 7.4, r: 3.2 },
  { t: 49,   pos: [-0.4, 0.1, -5.6],   look: [-5.0, -0.5, -11.6], f: 7.4, r: 3.2 },
  { t: 52,   pos: [0.6, 0.9, -12.5],   look: [0.2, 0.3, -36],    f: 14, r: 9 },
  { t: 55.5, pos: [0.3, 0.4, -25.0],   look: [-0.5, 0.2, -34],   f: 9,  r: 5 },
  { t: 57.5, pos: [-0.3, 0.1, -24.6],  look: [-3.6, -0.3, -32.4], f: 8.4, r: 3.6 },
  { t: 61,   pos: [-0.3, 0.1, -24.8],  look: [-3.4, -0.3, -32.4], f: 8.4, r: 3.6 },
  { t: 63,   pos: [0.1, 0.2, -26.5],   look: [0, 0.2, -36],      f: 9.5, r: 5 },
  { t: 66,   pos: [0, 0.2, -44.5],     look: [0, 0, -56],        f: 7.5, r: 4 },
  { t: 70,   pos: [0, 0.1, -45.5],     look: [0, 0, -56],        f: 6.5, r: 3.5 },
];
function lerp(a, b, k) { return a + (b - a) * k; }
function camAt(t) {
  let i = 0; while (i < KEYS.length - 2 && t >= KEYS[i + 1].t) i++;
  const a = KEYS[i], b = KEYS[i + 1];
  const k = E.smooth(clamp((t - a.t) / (b.t - a.t)));
  const v = (p, q) => [lerp(p[0], q[0], k), lerp(p[1], q[1], k), lerp(p[2], q[2], k)];
  return { pos: v(a.pos, b.pos), look: v(a.look, b.look), f: lerp(a.f, b.f, k), r: lerp(a.r, b.r, k) };
}

// ---------- typing: a real string revealed over time ----------
function typedChars(text, t, start, cps, pauses = []) {
  // pauses: [{ after: charIndex, hold: seconds }] hold the cursor before continuing
  let elapsed = t - start; if (elapsed <= 0) return 0;
  let chars = 0;
  for (const p of [...pauses, { after: text.length, hold: 0 }]) {
    const span = (p.after - chars) / cps;
    if (elapsed < span) return chars + Math.floor(elapsed * cps);
    elapsed -= span; chars = p.after;
    if (elapsed < p.hold) return chars;
    elapsed -= p.hold;
  }
  return text.length;
}
// the red run: "/land" typed, then the report lands row by row like a real terminal does
const redFull = `$ /land\n${D.red}`;
const redHead = redFull.indexOf('\n') + 1;
const redRowsIdx = []; { let p = redHead; for (const l of D.red.split('\n')) { p += l.length + 1; redRowsIdx.push(p); } }
function redChars(t) {
  const typed = typedChars('$ /land', t, 16.2, 14);
  if (typed < 7) return typed;
  if (t < 17.3) return 7;
  // the report: first line at 17.3, then one row every .32s for the layer rows, then the rest in a burst
  const rows = D.red.split('\n');
  let chars = redHead;
  for (let i = 0; i < rows.length; i++) {
    const at = i === 0 ? 17.3 : i <= 7 ? 17.7 + (i - 1) * .34 : 20.4 + (i - 8) * .05;
    if (t < at) return chars;
    chars += rows[i].length + 1;
  }
  return redFull.length;
}
function greenChars(t) {
  const typed = typedChars('$ /land', t, 44.4, 14);
  if (typed < 7) return typed;
  if (t < 45.5) return 7;
  const rows = D.green.split('\n');
  let chars = 8;
  for (let i = 0; i < rows.length; i++) {
    const at = i === 0 ? 45.5 : i <= 7 ? 45.9 + (i - 1) * .3 : 48.3 + (i - 8) * .05;
    if (t < at) return chars;
    chars += rows[i].length + 1;
  }
  return term2Text.length;
}
function term3Chars(t) {
  // push (typed), refused; approve (typed), approved; push (typed), through
  const L = term3Text.split('\n');
  const idx = []; { let p = 0; for (const l of L) { idx.push(p); p += l.length + 1; } }
  const typeLine = (li, start, cps) => Math.min(L[li].length, Math.max(0, Math.floor((t - start) * cps)));
  if (t < 54.0) return 0;
  if (t < 55.3) return idx[0] + typeLine(0, 54.0, 34);
  if (t < 55.6) return idx[1];
  if (t < 57.0) return idx[2];
  if (t < 58.9) return idx[2] + typeLine(2, 57.0, 58);
  if (t < 59.3) return idx[3];
  if (t < 60.0) return idx[4];
  if (t < 60.9) return idx[4] + typeLine(4, 60.0, 44);
  if (t < 61.5) return idx[5];
  return term3Text.length;
}


// ---------- draw one moment ----------
const V = new THREE.Vector3();
function seek(t) {
  resize();
  const cam = camAt(t);
  // a breath of handheld drift
  camera.position.set(cam.pos[0] + Math.sin(t * .7) * .04, cam.pos[1] + Math.cos(t * .9) * .03, cam.pos[2]);
  camera.lookAt(cam.look[0] + Math.sin(t * .5) * .05, cam.look[1] + Math.cos(t * .6) * .04, cam.look[2]);
  camera.rotation.z += Math.sin(t * .31) * .006;

  // corridor walls: fade in at the start, dim while the subjects speak, pull away at the end
  for (const p of corridor) {
    const far = p.g.position.z;
    p.alpha = p.base * T(t, 0, 2.5) * (1 - .55 * win(t, 15, 50, 2, 2)) * (far < -40 ? T(t, 61, 3) : 1);
    p.focus(camera, cam.f, cam.r);
  }

  // act 1: log and the diff
  gitLog.alpha = win(t, 5.5, 15.5, 1, 1.2); gitLog.focus(camera, cam.f, cam.r);
  diffP.alpha = T(t, 8.5, 1.4) * (1 - T(t, 36.5, 1.4)); diffP.draw(); diffP.focus(camera, cam.f, cam.r);

  // act 2: the red run types itself
  const tr = win(t, 15.0, 44.2, .8, .6) * (1 - .85 * win(t, 25.5, 36.8, .9, .9));
  term.alpha = tr; term.draw(redChars(t), t > 16.2 && t < 20.6); term.focus(camera, cam.f, cam.r);

  // the layers rise one by one as the report's rows land (17.7 + .34 each), the change passes them later
  for (let k = 0; k < 7; k++) {
    const L = layers[k];
    const a = T(t, 17.7 + k * .34, .9) * (1 - T(t, 64.5, 2));
    L.fill.material.opacity = .04 * a; L.edge.material.opacity = .5 * a; L.g.visible = a > .003;
    const greenAt = 45.9 + k * .3;          // round 2's rows turn the labels green
    const swap = T(t, greenAt, .4);
    L.label.alpha = a * (1 - swap) * win(t, 22, 70, .6, 1); L.label.focus(camera, cam.f, cam.r);
    L.label2.alpha = a * swap * (1 - T(t, 64.5, 2)); L.label2.focus(camera, cam.f, cam.r);
    const settle = T(t, 17.7 + k * .34, 1.6);
    L.g.position.y = (1 - settle) * -1.2;
    L.label.g.position.y = 2.95 + (1 - settle) * -1.2; L.label2.g.position.y = L.label.g.position.y;
  }

  // act 3: the findings fly in and pin to the diff
  for (let i = 0; i < findings.length; i++) {
    const f = findings[i];
    const at = 24.0 + i * 2.6;
    const a = T(t, at, .7) * (1 - T(t, 36.2, 1.0));
    f.panel.alpha = a; f.panel.focus(camera, cam.f, cam.r);
    const slide = 1 - T(t, at, 1.1);
    f.panel.g.position.x = f.pos[0] + slide * 2.2;
    // connector from the panel's left edge to the diff line
    diffP.g.updateMatrixWorld(); f.panel.g.updateMatrixWorld();
    const from = new THREE.Vector3(-f.panel.width / 2, 0, 0).applyMatrix4(f.panel.g.matrixWorld);
    const to = new THREE.Vector3(diffP.width / 2 - .05, diffP.lineY(f.at), .01).applyMatrix4(diffP.g.matrixWorld);
    const arr = connGeo.attributes.position.array;
    const kk = T(t, at + .5, .8);
    const mid = from.clone().lerp(to, kk);
    arr.set([from.x, from.y, from.z, mid.x, mid.y, mid.z], i * 6);
    dots[i].position.copy(to); dots[i].material.opacity = a * T(t, at + 1.2, .3);
    dots[i].scale.setScalar(1 + .5 * Math.abs(Math.sin(t * 4 + i)));
  }
  connGeo.attributes.position.needsUpdate = true;
  conn.material.opacity = .8 * T(t, 24.3, .6) * (1 - T(t, 36.2, 1.0));
  // the gate at the end: red during the red run, amber after the green run, cleared after approval
  gateRed.alpha = T(t, 20.2, .6) * (1 - T(t, 47.9, .5)); gateRed.focus(camera, cam.f, cam.r);
  gateAmber.alpha = T(t, 47.9, .5) * (1 - T(t, 59.3, .5)); gateAmber.focus(camera, cam.f, cam.r);
  gateOk.alpha = T(t, 59.3, .5) * (1 - T(t, 66.0, 1.5)); gateOk.focus(camera, cam.f, cam.r);
  document.getElementById('flash').style.opacity = (0.18 * Math.exp(-Math.max(0, t - 20.2) * 6) * (t > 20.2 ? 1 : 0) + 0.22 * Math.exp(-Math.max(0, t - 55.6) * 5) * (t > 55.6 ? 1 : 0)).toFixed(3);

  // act 4: the fix wipes over the diff; tests pass
  const fixReveal = T(t, 36.6, 4.2, E.lin);
  fixP.alpha = T(t, 36.4, .6) * (1 - T(t, 44.5, 1.2));
  fixP.draw(Math.floor(fixReveal * D.fixDiff.length), fixReveal < 1); fixP.focus(camera, cam.f, cam.r);
  testsP.alpha = T(t, 41.4, .6) * (1 - T(t, 44.5, 1.2)); testsP.draw(typedChars(`$ npm test\n${D.tests}`, t, 41.4, 60)); testsP.focus(camera, cam.f, cam.r);

  // act 5: round 2
  term2.alpha = T(t, 44.2, .6) * (1 - T(t, 51.5, 1.2)); term2.draw(greenChars(t), t > 44.4 && t < 48.9); term2.focus(camera, cam.f, cam.r);

  // act 6: the change travels the corridor; the push; the person; through
  const travel = T(t, 49.5, 6.0, E.inOut);
  const cz = -15.5 + travel * (-35.6 + 15.5); // starts well ahead of the lens
  const cy = .25 - .9 * travel;
  change.position.set(.1, cy, cz); changeGlow.position.set(.1, cy, cz - .01);
  const passed = LZ.filter(z => cz < z).length;
  change.material.opacity = win(t, 49.2, 63.5, .6, 1.2);
  change.material.color.setHex(t > 59.3 ? 0x9dffb0 : 0xffffff);
  changeGlow.material.opacity = .14 * change.material.opacity * (1 + Math.sin(t * 5) * .2) * T(t, 50.2, .8);
  changeGlow.material.color.setHex(t > 59.3 ? 0x9dffb0 : 0xffb454);
  change.rotation.y = t * .6;
  term3.alpha = T(t, 53.4, .6) * (1 - T(t, 63.2, 1)); term3.draw(term3Chars(t), (t > 54 && t < 55.3) || (t > 57 && t < 58.9) || (t > 60 && t < 60.9)); term3.focus(camera, cam.f, cam.r);

  // the end
  endP.alpha = T(t, 65.2, 1.2); endP.focus(camera, cam.f, cam.r);
  blogP.alpha = T(t, 66.4, 1.2); blogP.focus(camera, cam.f, cam.r);
  scene.fog.density = .028 - .006 * T(t, 64, 3);

  renderer.render(scene, camera);
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (renderer.domElement.width !== w || renderer.domElement.height !== h) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
}
window.seek = seek;
const q = new URLSearchParams(location.search);
seek(Number(q.get('t') || 0));
if (q.has('play')) { const t0 = performance.now(); (function loop() { seek(((performance.now() - t0) / 1000) % 69); requestAnimationFrame(loop); })(); }
